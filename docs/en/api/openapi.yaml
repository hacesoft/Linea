openapi: 3.1.0
info:
  title: LINEA API
  version: 1.0.0
  description: Read-only LINEA monitoring API 1.0.0, schema 1. Reference-flow contract; access control depends on
    Node-RED/reverse-proxy deployment.
servers:
- url: http://LINEA_HOST:1880
  description: Example Node-RED host; replace with your LINEA address
paths:
  /api/v1/health:
    get:
      summary: Main-state availability
      responses:
        '200':
          description: Response available; inspect freshness separately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                reference:
                  externalValue: ../../examples/health.json
        '503':
          description: Main state is initializing or the required snapshot is absent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                reference:
                  externalValue: ../../examples/health-initializing.json
      description: 200 if the main state object exists, including stale state; otherwise 503. Freshness threshold
        > 5000 ms.
  /api/v1/status:
    get:
      summary: Read-only LINEA snapshot
      description: 200 for a timestamped snapshot, including stale state. Threshold > 30000 ms. 503 if state or
        timestamp is missing. Does not validate every cached module or physical input.
      responses:
        '200':
          description: Response available; inspect freshness separately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              examples:
                reference:
                  externalValue: ../../examples/status.json
        '503':
          description: Main state is initializing or the required snapshot is absent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitializingResponse'
              examples:
                reference:
                  externalValue: ../../examples/status-initializing.json
components:
  schemas:
    ApiInfo:
      type: object
      required:
      - name
      - version
      - schema
      - readOnly
      properties:
        name:
          const: LINEA API
        version:
          const: 1.0.0
        schema:
          const: 1
        readOnly:
          const: true
    HealthResponse:
      type: object
      required:
      - api
      - status
      - sourceAgeMs
      - stale
      - timestamp
      properties:
        api:
          $ref: '#/components/schemas/ApiInfo'
        status:
          enum:
          - ok
          - initializing
        sourceAgeMs: &id002
          type:
          - integer
          - 'null'
          minimum: 0
        stale:
          type: boolean
          description: True when source age is unknown or > 5000 ms.
        timestamp: &id001
          type: string
          format: date-time
    InitializingResponse:
      type: object
      required:
      - api
      - status
      - timestamp
      properties:
        api:
          $ref: '#/components/schemas/ApiInfo'
        status:
          const: initializing
        timestamp: *id001
    ModuleEnvelope:
      type: object
      required:
      - available
      - data
      properties:
        available:
          type: boolean
          description: Presence of cached state; not a freshness or connectivity guarantee.
        data:
          type:
          - object
          - 'null'
          additionalProperties: true
    StatusResponse:
      type: object
      required:
      - api
      - system
      - units
      - conventions
      - energy
      - ess
      - spot
      - forecast
      - solar
      - weather
      - vrm
      - temperatures
      - shelly
      - ups
      - climate
      properties:
        api:
          $ref: '#/components/schemas/ApiInfo'
        system:
          type: object
          required:
          - timestamp
          - sourceTimestamp
          - ageMs
          - stale
          properties:
            timestamp: *id001
            sourceTimestamp:
              type: string
              description: Timestamp supplied by the source snapshot; malformed non-empty values can occur.
            ageMs: *id002
            stale:
              type: boolean
              description: True when age is unknown or > 30000 ms.
        units:
          type: object
          additionalProperties:
            type: string
        conventions:
          type: object
        energy:
          type: object
          additionalProperties: true
        ess:
          type: object
          additionalProperties: true
        spot:
          type: object
          additionalProperties: true
        forecast:
          type: object
          additionalProperties: true
        solar:
          type: object
          additionalProperties: true
        weather:
          type: object
          additionalProperties: true
        vrm:
          $ref: '#/components/schemas/ModuleEnvelope'
        temperatures:
          $ref: '#/components/schemas/ModuleEnvelope'
        shelly:
          $ref: '#/components/schemas/ModuleEnvelope'
        ups:
          $ref: '#/components/schemas/ModuleEnvelope'
        climate:
          $ref: '#/components/schemas/ModuleEnvelope'
      description: Envelope validation. Detailed paths are documented in x-linea-fields; this catalogue is descriptive
        metadata, not enforced nested JSON Schema. Source/module fields remain extensible.
