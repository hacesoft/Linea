openapi: 3.1.0
info:
  title: LINEA API
  version: 1.0.0
  description: Read-only monitoring API. Schema 1 adds explicit machine-readable units while keeping descriptions and field
    contracts in OpenAPI documentation.
servers:
- url: http://LINEA_HOST:1880
  description: Example Node-RED host; replace with your LINEA address
paths:
  /api/v1/health:
    get:
      summary: Kontrola dostupnosti LINEA API
      responses:
        '200':
          description: API je dostupné
        '503':
          description: LINEA se inicializuje nebo zdrojová data nejsou připravena
  /api/v1/status:
    get:
      summary: Aktuální read-only stav LINEA
      description: Vrací aktuální stav LINEA. Jednotky numerických polí jsou současně uvedeny v top-level objektu units.
      responses:
        '200':
          description: Aktuální stav
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '503':
          description: LINEA se inicializuje
components:
  schemas:
    StatusResponse:
      type: object
      required:
      - api
      - system
      - units
      - conventions
      properties:
        api:
          type: object
          properties:
            name:
              type: string
              example: LINEA API
            version:
              type: string
              example: 1.0.0
            schema:
              type: integer
              const: 1
            readOnly:
              type: boolean
              const: true
        system:
          type: object
        units:
          type: object
          description: Mapa JSON cest na jednotky. Popisy, typy, rozlišení a limity jsou v x-linea-fields této OpenAPI specifikace.
          additionalProperties:
            type: string
        conventions:
          type: object
        energy:
          type: object
        ess:
          type: object
        spot:
          type: object
        forecast:
          type: object
        solar:
          type: object
        weather:
          type: object
        vrm:
          type: object
        temperatures:
          type: object
        shelly:
          type: object
        ups:
          type: object
        climate:
          type: object
